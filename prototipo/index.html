<style>
/* Layout: app de celular (coluna de até 440px) em branco gelo, tinta quase preta da logo, cards brancos arredondados e um dourado discreto nos títulos de seção. Um visual só. */
:root {

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }

.app { max-width: 440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 104px; }

.bk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; width: 100%; }

.svc { grid-template-columns: auto minmax(0, 1fr) auto !important; }

.cat-h { color: var(--gold); }
.svc-adm { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.svc-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; }

.lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #FFFFFF; padding-bottom: 10px; }

function it(k) {
  const [i, o] = String(k).split(":"), s = svc(+i);
  if (!s) return { sid: +i, nome: "Serviço removido", preco: 0, min: 0, cat: "" };
  if (o == null || !s.opcoes[+o]) return { sid: s.id, nome: s.nome, preco: s.preco, min: s.min, cat: s.cat };
  const v = s.opcoes[+o];
  return { sid: s.id, nome: s.nome + " (" + v.nome + ")", preco: v.preco, min: v.min, cat: s.cat };
}
const sum = ks => ks.reduce((a, k) => a + it(k).preco, 0);
const mins = ks => ks.reduce((a, k) => a + it(k).min, 0);
const prosFor = ks => PROS.filter(p => ks.every(k => p.cats.includes(it(k).cat)));
const desde = s => s.opcoes.length ? Math.min(...s.opcoes.map(o => o.preco)) : s.preco;
const minDur = s => s.opcoes.length ? Math.min(...s.opcoes.map(o => o.min)) : s.min;

function slotsFor(proId, dk, need) {
  const p = pro(proId), out = [];
  const busy = S.bookings.filter(b => b.pro === proId && b.day === dk && b.status !== "reprovado" && b.status !== "pix")
    .map(b => [toMin(b.time), toMin(b.time) + mins(b.itens)]);
  const now = new Date(), isToday = dk === dayKey(now);
  for (let t = toMin(p.ini); t + need <= toMin(p.fim); t += 30) {
    const clash = busy.some(([a, z]) => t < z && t + need > a);
    const past = isToday && t <= now.getHours() * 60 + now.getMinutes();
    out.push({ t: toHM(t), free: !clash && !past });
  }
  return out;
}
function slotsAny(dk, need) {
  const all = {};
  prosFor(S.cart).forEach(p => slotsFor(p.id, dk, need).forEach(s => { if (s.free) all[s.t] = all[s.t] || p.id; else if (!(s.t in all)) all[s.t] = null; }));
  return Object.keys(all).sort().map(t => ({ t, free: !!all[t], pro: all[t] }));
}

  x.fillStyle = "#009EE3"; x.fillRect(0, 0, 600, 96);
  x.fillStyle = "#FFFFFF"; x.font = "bold 30px Montserrat, Arial"; x.fillText("Comprovante de Pix", 36, 60);
  x.fillStyle = "#555"; x.font = "500 22px Montserrat, Arial"; x.fillText("Valor", 36, 150);
  x.fillStyle = "#111"; x.font = "bold 54px Montserrat, Arial"; x.fillText(fmt(sum(b.itens)), 36, 212);
  const pago = (b.hist.find(h => h[2].startsWith("Pix confirmado")) || ["--"])[0];
  const rows = [["Data", dayLabel(dayKey(new Date())) + " · " + pago], ["De", b.nome], ["CPF", "***.482.***-**"], ["Para", "Favorita Beleza e Bem-Estar"], ["Instituição", "Mercado Pago"], ["Tipo", "Pix"], ["ID da transação", "E1835200" + (20261113000 + b.id) + "x7k"]];
  let y = 290;
  rows.forEach(([k, v]) => { x.fillStyle = "#777"; x.font = "500 20px Montserrat, Arial"; x.fillText(k, 36, y); x.fillStyle = "#111"; x.font = "600 23px Montserrat, Arial"; x.fillText(v, 36, y + 32); x.fillStyle = "#EEE"; x.fillRect(36, y + 52, 528, 2); y += 84; });
  x.fillStyle = "#B9443A"; x.font = "bold 20px Montserrat, Arial"; x.fillText("EXEMPLO · protótipo", 36, 905);
  b.receipt = c.toDataURL("image/png");

}

function tabs(items, cur) {

function render() {
  const root = document.getElementById("root"), bottom = document.getElementById("bottom");
  document.getElementById("as-cliente").setAttribute("aria-pressed", S.as === "cliente");
  document.getElementById("as-salao").setAttribute("aria-pressed", S.as === "salao");
  document.getElementById("as-salao").innerHTML = "Salão (dona)" + (pending() && S.as === "cliente" ? '<span class="pip"></span>' : "");
  if (S.as === "cliente") {
    const v = S.view;
    root.innerHTML = { catalogo: vCatalogo, agendar: vAgendar, pagar: vPagar, pix: vPix, meus: vMeus, perfil: vPerfil }[v]();
    const open = S.bookings.filter(b => b.mine && (b.status === "aguardando" || b.status === "pix")).length;
    const bar = { catalogo: S.cart.length ? bCatalogo : null, agendar: bAgendar, pagar: bPagar }[v];
    bottom.innerHTML = bar ? bar() : tabs([["catalogo", "Serviços", "svc"], ["meus", "Meus horários", "cal", open], ["perfil", "Perfil", "user"]], ["meus", "perfil"].includes(v) ? v : "catalogo");
    if (v === "pix") drawQR();
  } else if (S.detail) {
    root.innerHTML = vDetalhe(); bottom.innerHTML = "";
  } else if (S.draft) {
    root.innerHTML = vProEdit(); bottom.innerHTML = "";
  } else if (S.sdraft) {
    root.innerHTML = vSvcEdit(); bottom.innerHTML = "";
  } else if (S.cats) {
    root.innerHTML = vCats(); bottom.innerHTML = "";
  } else {
    root.innerHTML = { pedidos: vPedidos, agenda: vAgenda, servicos: vServicos, equipe: vEquipe }[S.tab]();
    bottom.innerHTML = tabs([["pedidos", "Pedidos", "inbox", pending()], ["agenda", "Agenda", "cal"], ["servicos", "Serviços", "list"], ["equipe", "Equipe", "team"]], S.tab);
  }
  document.getElementById("layer").innerHTML = lightbox();
}
let tt;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
function go(v) { S.view = v; render(); window.scrollTo(0, 0); }
function drawQR() {
  const c = document.getElementById("qr"); if (!c) return;
  const x = c.getContext("2d"), n = 29; let h = 2166136261 ^ S.pixFor;
  x.fillStyle = "#fff"; x.fillRect(0, 0, n, n); x.fillStyle = "#111";
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { h = Math.imul(h ^ (i * 31 + j), 16777619); if ((h >>> 7) & 1) x.fillRect(i, j, 1, 1); }
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => { x.fillStyle = "#111"; x.fillRect(a, b, 7, 7); x.fillStyle = "#fff"; x.fillRect(a + 1, b + 1, 5, 5); x.fillStyle = "#111"; x.fillRect(a + 2, b + 2, 3, 3); });
}

  if (d.cancelrej) { S.rejecting = null; render(); return; }

    if (b.pay === "pix" && b.paid) { b.refund = true; b.hist.push([hhmm(), "Sistema", "Pix devolvido pelo Mercado Pago"]); }
    S.rejecting = null; toast(b.refund ? "Reprovado. Pix devolvido à cliente." : "Reprovado. A cliente foi avisada."); render(); return;
  }
  if (d.zoom) { S.zoom = { id: +d.zoom, k: 1 }; render(); return; }
  if (d.zclose) { S.zoom = null; render(); return; }

  if (d.aday) { S.agendaDay = d.aday; render(); return; }

  if (d.tog) { const s = svc(+d.tog); s.disp = s.disp === "disponivel" ? "pausado" : "disponivel"; toast(s.nome + (s.disp === "disponivel" ? " disponível para as clientes." : " pausado hoje.")); render(); return; }
  if (d.svcedit) {
    const s = d.svcedit === "novo" ? { id: "novo", nome: "", desc: "", preco: 50, min: 60, cat: CATS[0], disp: "disponivel", foto: "", opcoes: [] } : svc(+d.svcedit);
    S.sdraft = { ...s, opcoes: s.opcoes.map(o => ({ ...o })) }; S.novaOpt = false; render(); window.scrollTo(0, 0); return;
  }
  if (d.svcfechar) { S.sdraft = null; render(); window.scrollTo(0, 0); return; }
  if (t.id === "svc-foto") { lerSvc(); document.getElementById("foto-input").click(); return; }
  if (t.id === "svc-rmfoto") { lerSvc(); S.sdraft.foto = ""; render(); return; }
  if (t.id === "opt-add") { lerSvc(); S.novaOpt = true; render(); return; }

    if (e.id === "novo") { SERVICES.push({ id: ++seq, ...dados }); toast(dados.nome + " publicado."); }
    else { Object.assign(SERVICES.find(s => s.id === e.id), dados); toast("Alterações em " + dados.nome + " salvas."); }
    S.sdraft = null; render(); window.scrollTo(0, 0); return;
  }
  if (t.id === "svc-dup") { lerSvc(); S.sdraft = { ...S.sdraft, id: "novo", nome: S.sdraft.nome + " (cópia)", opcoes: S.sdraft.opcoes.map(o => ({ ...o })) }; toast("Cópia criada. Ajuste e publique."); render(); window.scrollTo(0, 0); return; }

    if (CATS.length === 1) { toast("Precisa ter pelo menos uma categoria."); return; }
    CATS.splice(+d.rmcat, 1); PROS.forEach(p => p.cats = p.cats.filter(x => x !== c)); toast("Categoria " + c + " excluída."); render(); return;

document.addEventListener("change", e => {
  const id = e.target.dataset.preco;
  if (id) { svc(+id).preco = Math.max(0, +e.target.value || 0); toast("Preço de " + svc(+id).nome + " atualizado."); return; }
  if (e.target.id === "e-cat" || e.target.id === "e-disp") { lerSvc(); render(); return; }
  if (e.target.dataset.catidx) {
    const i = +e.target.dataset.catidx, velho = CATS[i], novo = e.target.value.trim();
    if (!novo || novo === velho) { e.target.value = velho; return; }
    if (CATS.includes(novo)) { toast("Essa categoria já existe."); e.target.value = velho; return; }
    CATS[i] = novo; SERVICES.forEach(s => { if (s.cat === velho) s.cat = novo; }); PROS.forEach(p => p.cats = p.cats.map(x => x === velho ? novo : x));
    if (S.cat === velho) S.cat = novo; if (CAT_IC[velho]) CAT_IC[novo] = CAT_IC[velho];
    toast("Categoria renomeada para " + novo + "."); render(); return;
  }
  if (e.target.id === "foto-input" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => { const c = document.createElement("canvas"), s = 320, k = Math.min(img.width, img.height); c.width = c.height = s; c.getContext("2d").drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, s, s); const url = c.toDataURL("image/jpeg", 0.85); if (S.as === "salao" && S.sdraft) S.sdraft.foto = url; else if (S.as === "salao" && S.draft) S.draft.foto = url; else S.perfil.foto = url; toast("Foto adicionada."); render(); };
      img.src = r.result;
    };
    r.readAsDataURL(e.target.files[0]); e.target.value = "";
  }
});
