<title>Favorita Agendamento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: redesign do Claude Design (handoff "Favorita App Redesign"): coluna de celular até 440px, fundo bege, cards brancos com sombra suave, ink para seleção e dourado para destaque. Um visual só. */
:root {
  --bg: #F5F2ED;
  --surface: #FFFFFF;
  --soft: #F8F5F1;
  --muted-bg: #F0EBE5;
  --ink: #211B18;
  --ink-2: #4A403B;
  --muted: #7A6F68;
  --faint: #9A8F88;
  --faint-2: #BDB3AA;
  --line: #E8E1D9;
  --line-2: #EDE7E0;
  --gold: #A47A35;
  --gold-mid: #B8893F;
  --gold-line: #C9A25E;
  --gold-light: #E2C08A;
  --gold-tint: #F6EEDF;
  --gold-tint-2: #FBF6EE;
  --gold-grad: linear-gradient(135deg, #CDA866, #A97C36);
  --blush: #EFE3DB;
  --ok: #2F7A55; --ok-bg: #E3F0E8;
  --bad: #B5453A; --bad-bg: #F7E4E0; --bad-soft: #FBF1EE;
  --pix: #2B9C8F; --pix-bg: #E3F3F1;
  --sh-card: 0 1px 2px rgba(33,27,24,.04), 0 10px 24px -14px rgba(33,27,24,.18);
  --sh-gold: 0 16px 32px -12px rgba(169,124,54,.7);
  --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 14px; font-weight: 500; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--gold-line); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 600; }
.app { max-width: 440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 120px; }
.app.tall { padding-bottom: 200px; }
.view { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
.pad-x { padding-inline: 6px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }
.meta { font-size: 12.5px; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tag-ex { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); background: var(--gold-tint); border-radius: 6px; padding: 2px 6px; vertical-align: middle; }

/* controle do protótipo */
.demo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); padding-block: 10px; display: flex; align-items: center; gap: 10px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--bg); }
.demo small { color: var(--faint); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.seg { display: flex; flex: 1; background: var(--muted-bg); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--muted); position: relative; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(33,27,24,.1); }
.pip { position: absolute; top: 6px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

/* topo */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 6px 2px; }
.top img { height: 48px; width: auto; }
.top-r { text-align: right; }
.top-r b { display: block; font-size: 14px; font-weight: 600; }
.nav { display: flex; align-items: center; gap: 12px; padding: 6px 2px 0; }
.circ { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--sh-card); display: grid; place-items: center; flex: none; }
.circ svg { width: 18px; height: 18px; }
.nav h2 { font-size: 17px; font-weight: 600; letter-spacing: 0; }
.nav .note { margin-left: auto; }

/* avatar */
.ava { flex: none; border-radius: 50%; display: grid; place-items: center; overflow: hidden; font-weight: 700; color: var(--ink-2); background: var(--blush); }
.ava img { width: 100%; height: 100%; object-fit: cover; }
.ava.xs { width: 22px; height: 22px; font-size: 10px; }
.ava.sm { width: 32px; height: 32px; font-size: 12px; }
.ava.md { width: 44px; height: 44px; font-size: 15px; }
.ava.lg { width: 64px; height: 64px; font-size: 22px; }
.ava.xl { width: 96px; height: 96px; font-size: 32px; }
.ava.ring { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--gold-line); }
.ava.me { width: 50px; height: 50px; font-size: 16px; color: #FFFFFF; background: #C9927E; border: 0; padding: 0; }

/* chips e segmentado */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.segm { display: flex; background: var(--muted-bg); border-radius: 14px; padding: 4px; gap: 4px; }
.segm button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
.segm button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(33,27,24,.1); }
.segm.mini { padding: 3px; border-radius: 10px; }
.segm.mini button { padding: 5px 12px; font-size: 12.5px; border-radius: 8px; }

/* cards */
.card { background: var(--surface); border: 1px solid transparent; border-radius: 20px; padding: 16px 18px; box-shadow: var(--sh-card); }
.card.flat { box-shadow: none; border-color: var(--line); }
.sec { display: flex; flex-direction: column; gap: 10px; }

/* serviço (catálogo) */
.scard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; width: 100%; }
.scard.on { border: 1.5px solid var(--gold-line); }
.scard:disabled { opacity: 0.55; cursor: not-allowed; }
.scard p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.smeta { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; }
.ttag { background: var(--bg); border-radius: 8px; padding: 3px 8px; font-size: 12px; color: var(--muted); }
.smeta b { font-weight: 700; font-variant-numeric: tabular-nums; }
.optag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--gold); background: var(--gold-tint); border-radius: 6px; padding: 2px 7px; vertical-align: middle; }
.addc { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-size: 18px; line-height: 1; color: var(--ink-2); }
.scard.on .addc { background: var(--gold-mid); color: #FFFFFF; font-size: 15px; }
.tag-off { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); background: var(--muted-bg); border-radius: 6px; padding: 2px 7px; vertical-align: middle; margin-left: 6px; }

/* barra flutuante dourada + rodapés */
.float { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 26; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); animation: up 0.2s ease-out; }
.float-in { max-width: 408px; margin: 0 auto; background: var(--gold-grad); color: #FFFFFF; border-radius: 20px; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--sh-gold); }
.bagic { position: relative; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.bagic svg { width: 20px; height: 20px; }
.bagic span { position: absolute; top: -6px; left: -6px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--ink); color: #FFFFFF; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.float-in small { display: block; font-size: 12px; opacity: 0.9; }
.float-in b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.btn-w { margin-left: auto; border: 0; background: #FFFFFF; color: var(--ink); border-radius: 14px; padding: 12px 16px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.goldcta { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 26; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.goldcta button, .btn-gold { width: 100%; max-width: 408px; display: flex; margin: 0 auto; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; background: var(--gold-grad); color: #FFFFFF; font-weight: 700; font-size: 14.5px; padding: 15px; box-shadow: var(--sh-gold); }
.goldcta button:disabled { background: var(--muted-bg); color: var(--muted); box-shadow: none; cursor: default; }
.btn-gold svg, .goldcta svg { width: 17px; height: 17px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line-2); padding: 14px max(22px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 396px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar-in small { display: block; font-size: 12px; color: var(--muted); }
.bar-in b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar-col { max-width: 396px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; text-align: center; }
.bar-col small { font-size: 12px; color: var(--muted); }
.btn { border: 0; border-radius: 14px; background: var(--ink); color: #FFFFFF; font-weight: 600; font-size: 14px; padding: 14px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:disabled { background: var(--muted-bg); color: var(--faint); cursor: not-allowed; }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.btn.soft { background: var(--bg); color: var(--ink); font-size: 13px; padding: 11px 12px; }
.btn.bad { background: var(--surface); border: 1px solid var(--line); color: var(--bad); }
.btn.full { width: 100%; }
.link { border: 0; background: none; padding: 0; color: var(--gold); font-weight: 700; font-size: 13px; }

/* stepper */
.steps { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 12.5px; color: var(--faint); }
.st { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.st i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; background: var(--muted-bg); color: var(--faint); }
.st.done { color: var(--ink-2); }
.st.done i { background: var(--gold-mid); color: #FFFFFF; }
.st.cur { color: var(--ink); font-weight: 700; }
.st.cur i { background: var(--ink); color: #FFFFFF; }
.steps hr { flex: 1; border: 0; height: 1.5px; background: var(--line); margin: 0; min-width: 12px; }
.steps hr.done { background: var(--gold-mid); }

.strip { display: flex; align-items: center; gap: 10px; background: var(--gold-tint); border-radius: 14px; padding: 12px 14px; font-size: 13px; }
.strip svg { width: 18px; height: 18px; color: var(--gold); flex: none; }
.strip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* profissional */
.hs { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-inline: -18px; padding: 2px 18px 4px; }
.hs::-webkit-scrollbar { display: none; }
.pcard { position: relative; flex: none; width: 132px; border: 1px solid var(--line-2); background: var(--soft); border-radius: 18px; padding: 16px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
.pcard[aria-pressed="true"] { background: var(--gold-tint-2); border-color: var(--gold-line); }
.pcard .ck { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold-mid); color: #FFFFFF; font-size: 11px; display: none; place-items: center; }
.pcard[aria-pressed="true"] .ck { display: grid; }
.pcard[aria-pressed="true"] .ava { box-shadow: 0 0 0 3px var(--gold-tint-2), 0 0 0 4.5px var(--gold-line); }
.pcard b { font-size: 14px; font-weight: 700; margin-top: 4px; }
.pcard .hr { font-size: 11.5px; color: var(--gold); font-weight: 600; }
.skills { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 4px; }
.skills span { font-size: 10.5px; font-weight: 600; color: var(--gold); border: 1px solid var(--gold-line); border-radius: 999px; padding: 2px 8px; background: var(--surface); }
.skills span.n { color: var(--ink-2); border-color: var(--line); background: var(--muted-bg); }
.anyico { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); color: var(--gold-light); display: grid; place-items: center; font-size: 22px; }

/* dia e horário */
.monthnav { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
.monthnav button { border: 0; background: none; color: var(--faint); font-size: 16px; padding: 0 4px; }
.monthnav button:disabled { opacity: 0.3; cursor: default; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { border: 0; background: none; border-radius: 14px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.wd b { font-size: 18px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.wd i { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
.wd i.on { background: var(--gold-mid); }
.wd:disabled { opacity: 0.35; cursor: not-allowed; }
.wd[aria-pressed="true"] { background: var(--ink); color: var(--gold-light); }
.wd[aria-pressed="true"] b { color: #FFFFFF; }
.wd[aria-pressed="true"] i.on { background: var(--gold-light); }
.times { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.time { border: 1px solid transparent; background: var(--soft); border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.time[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
.time:disabled { background: none; border: 1.5px dashed var(--line); color: var(--faint-2); text-decoration: line-through; cursor: not-allowed; }

/* confirmar */
.rcard { padding: 0; overflow: hidden; }
.rhead { background: var(--ink); color: #FFFFFF; display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
.dblock { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.dblock small { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-light); }
.dblock b { font-size: 28px; font-weight: 700; }
.rhead .hh { border-left: 1px solid rgba(255,255,255,.18); padding-left: 16px; }
.rhead .hh b { font-size: 16px; font-weight: 700; display: block; }
.rhead .hh span { font-size: 13px; color: rgba(255,255,255,.65); }
.rbody { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 9px; }
.kv { display: flex; justify-content: space-between; gap: 14px; font-size: 14px; }
.kv span:first-child { color: var(--ink-2); min-width: 0; }
.kv span:last-child { font-weight: 600; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.kv.total { border-top: 1px solid var(--line-2); padding-top: 11px; font-size: 16px; }
.kv.total span { font-weight: 700; color: var(--ink); }
.kv.dim span:first-child { color: var(--muted); }
.payopt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; text-align: left; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: 16px; padding: 14px; }
.payopt[aria-pressed="true"] { border-color: var(--gold-line); background: var(--gold-tint-2); }
.payopt h3 { font-size: 14.5px; }
.payopt p { font-size: 12.5px; color: var(--muted); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--faint-2); }
.payopt[aria-pressed="true"] .radio { border-color: var(--gold-mid); box-shadow: inset 0 0 0 3px var(--surface); background: var(--gold-mid); }
.pixtile { width: 44px; height: 44px; border-radius: 12px; background: var(--pix-bg); display: grid; place-items: center; flex: none; }
.pixtile i { width: 18px; height: 18px; border: 2.2px solid var(--pix); border-radius: 3px; transform: rotate(45deg); }
.minicard { width: 44px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #3A302B, #211B18); position: relative; flex: none; margin-inline: 0; }
.minicard::before { content: ""; position: absolute; top: 8px; left: 6px; width: 9px; height: 7px; border-radius: 2px; background: var(--gold-light); }
.minicard::after { content: ""; position: absolute; bottom: 6px; left: 6px; right: 8px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.35); }
.payin { display: flex; gap: 8px; padding-left: 58px; }
label.field, div.field { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
input[type="text"], input[type="tel"], input[type="number"], input[type="time"], textarea, select { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--ink); font: inherit; font-size: 14px; width: 100%; }
textarea { min-height: 72px; resize: vertical; }
.obsbox textarea { border: 0; padding: 0; min-height: 44px; }

/* pix */
.qr { align-self: center; background: #FFFFFF; padding: 14px; border-radius: 18px; box-shadow: var(--sh-card); }
.qr canvas { display: block; width: 196px; height: 196px; image-rendering: pixelated; }
.code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 12px; word-break: break-all; }
.waiting { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--gold); font-weight: 600; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: s 0.9s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
@keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.warn { color: var(--gold); background: var(--gold-tint); }
.pill.n { color: var(--muted); background: var(--muted-bg); }
.pill.dotted::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* meus horários */
.bcard { border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.bline { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 14px; align-items: center; }
.dbox { width: 54px; height: 62px; border-radius: 14px; background: var(--ink); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.dbox small { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold-light); }
.dbox b { font-size: 22px; font-weight: 700; }
.dbox em { font-style: normal; font-size: 10px; color: rgba(255,255,255,.5); }
.dbox.dim { background: var(--muted-bg); color: var(--faint); }
.dbox.dim small { color: var(--faint); }
.dbox.dim em { color: var(--faint-2); }
.bline h3 { font-size: 15px; font-weight: 700; }
.who { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; margin-top: 5px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--line-2); padding-top: 14px; }
.why { display: flex; gap: 10px; align-items: flex-start; background: var(--bad-soft); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--ink-2); }

.empty { text-align: center; color: var(--muted); padding: 30px 16px; border: 1.5px dashed var(--line); border-radius: 20px; font-size: 13.5px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* painel */
.ink-stats { background: var(--ink); color: #FFFFFF; border-radius: 20px; padding: 16px 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ink-stats div { text-align: center; padding: 0 6px; }

function it(k) {
  const [i, o] = String(k).split(":"), s = svc(+i);
  if (!s) return { sid: +i, nome: "Serviço removido", base: "Serviço removido", op: "", preco: 0, min: 0, cat: "" };
  if (o == null || !s.opcoes[+o]) return { sid: s.id, nome: s.nome, base: s.nome, op: "", preco: s.preco, min: s.min, cat: s.cat };
  const v = s.opcoes[+o];
  return { sid: s.id, nome: s.nome + " (" + v.nome + ")", base: s.nome, op: v.nome, preco: v.preco, min: v.min, cat: s.cat };
}

function slotsFor(proId, dk, need) {
  const p = pro(proId), out = [];
  if (!aberto(dk)) return out;
  const busy = S.bookings.filter(b => b.pro === proId && b.day === dk && b.status !== "reprovado" && b.status !== "pix")
    .map(b => [toMin(b.time), toMin(b.time) + mins(b.itens)]);
  const now = new Date(), isToday = dk === HOJE;
  for (let t = toMin(p.ini); t + need <= toMin(p.fim); t += 30) {
    const clash = busy.some(([a, z]) => t < z && t + need > a);
    const past = isToday && t <= now.getHours() * 60 + now.getMinutes();
    out.push({ t: toHM(t), free: !clash && !past, pro: proId });
  }
  return out;
}
function slotsAny(dk, need) {
  const all = {};
  prosFor(S.cart).forEach(p => slotsFor(p.id, dk, need).forEach(s => { if (s.free) all[s.t] = all[s.t] || p.id; else if (!(s.t in all)) all[s.t] = null; }));
  return Object.keys(all).sort().map(t => ({ t, free: !!all[t], pro: all[t] }));
}
const slots = dk => { const need = mins(S.cart); return S.pro === "qualquer" ? slotsAny(dk, need) : slotsFor(S.pro, dk, need); };

function livreMin(day, proId) {
  const ps = proId === "todas" ? PROS : [pro(proId)];
  if (!aberto(day) && day !== HOJE) return 0;
  return ps.reduce((acc, p) => {
    const ocup = S.bookings.filter(b => b.pro === p.id && b.day === day && (b.status === "aprovado" || b.status === "aguardando")).reduce((a, b) => a + mins(b.itens), 0);
    return acc + Math.max(0, toMin(p.fim) - toMin(p.ini) - ocup);
  }, 0);
}
function vAgenda() {

  list.sort((a, b) => a.time.localeCompare(b.time));

    rows.push(b);
    const fim = toMin(b.time) + mins(b.itens), prox = list[i + 1];
    if (prox && toMin(prox.time) - fim >= 30) rows.push({ gap: true, de: toHM(fim), ate: prox.time });

  return `<section class="view">
    <div class="row pad-x" style="margin-top:12px;align-items:baseline"><h1>Agenda</h1><span class="meta">${MES[dOf(day).getMonth()][0].toUpperCase() + MES[dOf(day).getMonth()].slice(1)}</span></div>

/* ===== folhas, zoom e render ===== */
function sheet() {
  const sh = S.sheet; if (!sh) return "";
  let body = "";
  if (sh.t === "opt") {
    const s = svc(sh.sid);
    body = `<h2>${esc(s.nome)}</h2><p class="meta">Escolha uma opção. O preço e o tempo mudam conforme a escolha.</p>
      ${s.opcoes.map((o, i) => `<button class="opt" type="button" data-addopt="${s.id}:${i}"><span>${esc(o.nome[0].toUpperCase() + o.nome.slice(1))}<small>${dur(o.min)}</small></span><b>${fmt(o.preco)}</b></button>`).join("")}`;
  }
  if (sh.t === "rej") {
    const b = bk(sh.id);
    body = `<h2>Reprovar pedido</h2><p class="meta">${esc(b.nome)} · ${esc(nomes(b.itens))}. A cliente vê o motivo.${b.pay === "pix" && b.paid ? " O Pix de " + fmt(sum(b.itens)) + " volta automático para ela." : ""}</p>
      ${["Horário indisponível", "Profissional ausente", "Salão fechado nesse dia"].map(r => `<button class="opt" type="button" data-motivo="${r}"><span>${r}</span><b style="color:var(--bad)">→</b></button>`).join("")}`;
  }
  if (sh.t === "caixa") {
    const dia = S.lanc.filter(l => l.day === S.finDay), tot = dia.reduce((a, l) => a + l.valor, 0);
    body = `<h2>Fechar caixa</h2><p class="meta">${dayShort(S.finDay)} · ${dia.length} lançamentos. Depois de fechar, os lançamentos do dia ficam travados.</p>
      <div class="card flat sec">${Object.keys(FORMAS).map(f => `<div class="kv"><span>${FORMAS[f][0]}</span><span>${fmt(dia.filter(l => l.forma === f).reduce((a, l) => a + l.valor, 0))}</span></div>`).join("")}<div class="kv total"><span>Total</span><span>${fmt(tot)}</span></div></div>
      <button class="btn-gold" type="button" id="caixa-ok">${IC.lock}Confirmar fechamento</button>`;
  }
  return `<div class="scrim" data-sheetclose="1"><div class="sheet" role="dialog" aria-modal="true"><span class="grab"></span>${body}<button class="btn ghost full" type="button" data-sheetclose="1">Cancelar</button></div></div>`;
}
function lightbox() {
  if (!S.zoom) return "";
  const b = bk(S.zoom.id), w = Math.round(S.zoom.k * 100);
  return `<div class="lightbox" role="dialog" aria-label="Comprovante do Pix"><div class="lb-bar"><button type="button" data-zclose="1">✕ Fechar</button><span style="font-size:13px">${w}%</span><div style="display:flex;gap:6px"><button type="button" data-z="-1" aria-label="Diminuir">−</button><button type="button" data-z="1" aria-label="Aumentar">+</button></div></div>
    <div class="lb-view"><img src="${receipt(b)}" alt="Comprovante do Pix de ${esc(b.nome)}" style="width:${w}%"></div></div>`;
}
function render() {
  const root = document.getElementById("root"), bottom = document.getElementById("bottom"), app = document.getElementById("app");
  document.getElementById("as-cliente").setAttribute("aria-pressed", S.as === "cliente");
  document.getElementById("as-salao").setAttribute("aria-pressed", S.as === "salao");
  document.getElementById("as-salao").innerHTML = "Salão (dona)" + (pending() && S.as === "cliente" ? '<span class="pip"></span>' : "");
  let tall = false;
  if (S.as === "cliente") {
    const v = S.view;
    root.innerHTML = { catalogo: vCatalogo, agendar: vAgendar, pagar: vPagar, pix: vPix, meus: vMeus, perfil: vPerfil }[v]();
    const nav = tabs([["catalogo", "Serviços", "bag"], ["meus", "Horários", "cal"], ["perfil", "Perfil", "user"]], ["meus", "perfil"].includes(v) ? v : "catalogo");
    if (v === "agendar") bottom.innerHTML = bAgendar();
    else if (v === "pagar") bottom.innerHTML = bPagar();
    else if (v === "pix") bottom.innerHTML = nav;
    else { bottom.innerHTML = (v === "catalogo" ? fCatalogo() : "") + nav; tall = v === "catalogo" && S.cart.length > 0; }
    if (v === "pix") drawQR();
  } else if (S.detail) { root.innerHTML = vDetalhe(); bottom.innerHTML = ""; }
  else if (S.draft) { root.innerHTML = vProEdit(); bottom.innerHTML = ""; }
  else if (S.sdraft) { root.innerHTML = vSvcEdit(); bottom.innerHTML = ""; }
  else if (S.cats) { root.innerHTML = vCats(); bottom.innerHTML = ""; }
  else {
    root.innerHTML = { pedidos: vPedidos, agenda: vAgenda, financeiro: vFinanceiro, servicos: vServicos, equipe: vEquipe }[S.tab]();
    bottom.innerHTML = (S.tab === "financeiro" ? fFinanceiro() : "") + tabs([["pedidos", "Pedidos", "inbox", pending()], ["agenda", "Agenda", "cal"], ["financeiro", "Financeiro", "wallet"], ["servicos", "Serviços", "list"], ["equipe", "Equipe", "users"]], S.tab);
    tall = S.tab === "financeiro";
  }
  app.classList.toggle("tall", tall);
  document.getElementById("layer").innerHTML = sheet() + lightbox();
}
let tt;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
function go(v) { S.view = v; S.sheet = null; render(); window.scrollTo(0, 0); }
function drawQR() {
  const c = document.getElementById("qr"); if (!c) return;
  const x = c.getContext("2d"), n = 29; let h = 2166136261 ^ S.pixFor;
  x.fillStyle = "#fff"; x.fillRect(0, 0, n, n); x.fillStyle = "#211B18";
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { h = Math.imul(h ^ (i * 31 + j), 16777619); if ((h >>> 7) & 1) x.fillRect(i, j, 1, 1); }
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => { x.fillStyle = "#211B18"; x.fillRect(a, b, 7, 7); x.fillStyle = "#fff"; x.fillRect(a + 1, b + 1, 5, 5); x.fillStyle = "#211B18"; x.fillRect(a + 2, b + 2, 3, 3); });
}
function readPerfilFields() {
  const el = document.getElementById("p-nome");
  if (el) { S.perfil.nome = el.value.trim(); S.perfil.fone = document.getElementById("p-fone").value.trim(); S.perfil.end = document.getElementById("p-end").value.trim(); }
}
function lerSvc() {
  const g = id => document.getElementById(id);
  if (!S.sdraft || !g("e-nome")) return;
  Object.assign(S.sdraft, { nome: g("e-nome").value, desc: g("e-desc").value, preco: g("e-preco").value, min: +g("e-min").value, cat: g("e-cat").value, disp: g("e-disp").value });
}
function aprovar(b) {
  b.status = "aprovado"; b.hist.push([hhmm(), "Dona", "Aprovou o agendamento"]);
  S.lanc.push({ id: ++seq, bid: b.id, forma: b.pay === "pix" ? "pix" : b.payIn, valor: sum(b.itens), nome: b.nome, itens: b.itens, at: hhmm(), day: HOJE });
  toast("Aprovado. Lançado no Financeiro e a cliente já vê confirmado.");
}
function fimSemana() { const k = weekDays(S.week).find(x => aberto(x)); if (k && !weekDays(S.week).includes(S.day)) { S.day = k; S.time = null; } }
let detailFrom = null;

document.addEventListener("click", e => {
  const t = e.target.closest("button, .scrim");
  if (!t) return;
  const d = t.dataset;
  if (d.sheetclose && (t.tagName === "BUTTON" || e.target === t)) { S.sheet = null; render(); return; }
  if (t.classList.contains("scrim")) return;
  if (t.id === "as-cliente") { S.as = "cliente"; S.zoom = null; S.sheet = null; render(); return; }
  if (t.id === "as-salao") { readPerfilFields(); S.as = "salao"; S.sheet = null; render(); window.scrollTo(0, 0); return; }
  if (d.tab) {
    if (S.as === "cliente") { readPerfilFields(); go(d.tab); }
    else { S.tab = d.tab; S.detail = null; S.draft = null; S.sdraft = null; S.cats = false; S.sheet = null; render(); window.scrollTo(0, 0); }
    return;
  }
  /* cliente */
  if (d.cat) { S.cat = d.cat; render(); return; }
  if (d.svc) {
    const s = svc(+d.svc);
    if (S.cart.some(k => it(k).sid === s.id)) S.cart = S.cart.filter(k => it(k).sid !== s.id);
    else if (s.opcoes.length) S.sheet = { t: "opt", sid: s.id };
    else S.cart = [...S.cart, String(s.id)];
    S.time = null; render(); return;
  }
  if (d.addopt) { S.cart = [...S.cart, d.addopt]; S.sheet = null; S.time = null; render(); return; }
  if (t.id === "go-agendar") { go("agendar"); return; }
  if (d.go) { if (d.refaz) { S.cart = bk(+d.refaz).itens.map(String); S.time = null; } go(d.go); return; }
  if (d.pro) { S.pro = d.pro; S.time = null; render(); return; }
  if (d.wk) { S.week = Math.max(0, Math.min(3, S.week + +d.wk)); fimSemana(); render(); return; }
  if (d.day) { S.day = d.day; S.time = null; render(); return; }
  if (d.turno) { S.turno = d.turno; S.time = null; render(); return; }
  if (d.time) { S.time = d.time; render(); return; }
  if (t.id === "go-pagar") { go("pagar"); return; }
  if (d.pay) { S.pay = d.pay; render(); return; }
  if (d.payin) { S.payIn = d.payin; render(); return; }
  if (t.id === "enviar") {
    const fn = document.getElementById("f-nome");
    if (fn) { S.perfil.nome = fn.value.trim(); S.perfil.fone = document.getElementById("f-fone").value.trim(); }
    S.obs = document.getElementById("f-obs").value.trim();
    if (!S.perfil.nome || S.perfil.fone.replace(/\D/g, "").length < 10) { toast("Preencha seu nome e um WhatsApp com DDD."); return; }
    const P = S.perfil;
    const b = { id: ++seq, nome: P.nome, fone: P.fone, end: P.end, foto: P.foto, itens: [...S.cart], pro: quemNoHorario(), day: S.day, time: S.time, obs: S.obs, pay: S.pay, payIn: S.payIn, paid: false, status: S.pay === "pix" ? "pix" : "aguardando", mine: true, hist: [[hhmm(), "Cliente", "Pedido criado"]] };
    S.bookings.push(b); S.cart = []; S.time = null; S.obs = ""; S.meusTab = "prox";
    if (b.pay === "pix") { S.pixFor = b.id; go("pix"); } else { toast("Pedido enviado! Aguarde a aprovação do salão."); go("meus"); }
    return;
  }
  if (d.pagar) { S.pixFor = +d.pagar; go("pix"); return; }
  if (t.id === "copiar") {
    const el = document.getElementById("pix-code");
    const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Código selecionado. Copie e cole no app do banco."); };
    try { navigator.clipboard.writeText(el.textContent).then(() => toast("Código Pix copiado."), sel); } catch (_) { sel(); }
    return;
  }
  if (t.id === "simular-pix") { const b = bk(S.pixFor); b.paid = true; b.status = "aguardando"; b.hist.push([hhmm(), "Sistema", "Pix confirmado pelo Mercado Pago"]); toast("Pix confirmado! Pedido enviado ao salão."); go("meus"); return; }
  if (d.meus) { S.meusTab = d.meus; render(); return; }
  if (t.id === "trocar-foto") { readPerfilFields(); document.getElementById("foto-input").click(); return; }
  if (t.id === "salvar-perfil") { readPerfilFields(); toast("Perfil salvo."); render(); return; }
  /* salão: pedidos */
  if (d.open) { detailFrom = window.scrollY; S.detail = +d.open; render(); window.scrollTo(0, 0); return; }
  if (d.fechar) { S.detail = null; render(); window.scrollTo(0, detailFrom || 0); return; }
  if (d.apr) { aprovar(bk(+d.apr)); render(); return; }
  if (d.rej) { S.sheet = { t: "rej", id: +d.rej }; render(); return; }
  if (d.motivo) {
    const b = bk(S.sheet.id); b.status = "reprovado"; b.motivo = d.motivo; b.hist.push([hhmm(), "Dona", "Reprovou: " + d.motivo]);
    if (b.pay === "pix" && b.paid) { b.refund = true; b.hist.push([hhmm(), "Sistema", "Pix devolvido pelo Mercado Pago"]); }
    S.sheet = null; toast(b.refund ? "Reprovado. Pix devolvido à cliente." : "Reprovado. A cliente foi avisada."); render(); return;
  }
  if (d.zoom) { S.zoom = { id: +d.zoom, k: 1 }; render(); return; }
  if (d.zclose) { S.zoom = null; render(); return; }
  if (d.z) { S.zoom.k = Math.min(3, Math.max(0.5, S.zoom.k + 0.5 * +d.z)); render(); return; }
  /* agenda e financeiro */
  if (d.aday) { S.aDay = d.aday; render(); return; }
  if (d.apro) { S.aPro = d.apro; render(); return; }
  if (d.encaixe) { toast("Encaixe: no sistema real a dona marca um horário direto pelo painel a partir de " + d.encaixe + "."); return; }
  if (d.finf) { S.finF = d.finf; render(); return; }
  if (t.id === "fechar-caixa") { S.sheet = { t: "caixa" }; render(); return; }
  if (t.id === "caixa-ok") { const dia = S.lanc.filter(l => l.day === S.finDay); S.caixas[S.finDay] = { at: hhmm(), total: dia.reduce((a, l) => a + l.valor, 0) }; S.sheet = null; toast("Caixa do dia fechado."); render(); return; }
  /* serviços */
  if (d.tog) { const s = svc(+d.tog); s.disp = s.disp === "disponivel" ? "pausado" : "disponivel"; toast(s.nome + (s.disp === "disponivel" ? " disponível para as clientes." : " pausado hoje.")); render(); return; }
  if (d.svcedit) {
    const s = d.svcedit === "novo" ? { id: "novo", nome: "", desc: "", preco: 50, min: 60, cat: CATS[0], disp: "disponivel", foto: "", opcoes: [] } : svc(+d.svcedit);
    S.sdraft = { ...s, opcoes: s.opcoes.map(o => ({ ...o })) }; S.novaOpt = false; render(); window.scrollTo(0, 0); return;
  }
  if (d.svcfechar) { S.sdraft = null; render(); window.scrollTo(0, 0); return; }
  if (t.id === "svc-foto") { lerSvc(); document.getElementById("foto-input").click(); return; }
  if (t.id === "svc-rmfoto") { lerSvc(); S.sdraft.foto = ""; render(); return; }
  if (t.id === "opt-add") { lerSvc(); S.novaOpt = true; render(); return; }
  if (d.optcancel) { S.novaOpt = false; render(); return; }
  if (t.id === "opt-ok") {
    const n = document.getElementById("o-nome").value.trim();
    if (!n) { toast("Coloque o nome da opção."); return; }
    lerSvc(); S.sdraft.opcoes.push({ nome: n, preco: Math.max(0, +document.getElementById("o-preco").value || 0), min: +document.getElementById("o-min").value });
    S.novaOpt = false; render(); return;
  }
  if (d.rmopt) { lerSvc(); S.sdraft.opcoes.splice(+d.rmopt, 1); render(); return; }
  if (t.id === "svc-salvar") {
    lerSvc(); const e2 = S.sdraft;
    if (!e2.nome.trim()) { toast("Coloque o nome do serviço."); return; }
    const dados = { nome: e2.nome.trim(), desc: e2.desc.trim(), preco: Math.max(0, +e2.preco || 0), min: +e2.min, cat: e2.cat, disp: e2.disp, foto: e2.foto, opcoes: e2.opcoes };
    if (e2.id === "novo") { SERVICES.push({ id: ++seq, ...dados }); toast(dados.nome + " publicado."); }
    else { Object.assign(SERVICES.find(s => s.id === e2.id), dados); toast("Alterações em " + dados.nome + " salvas."); }
    S.sdraft = null; render(); window.scrollTo(0, 0); return;
  }
  if (t.id === "svc-dup") { lerSvc(); S.sdraft = { ...S.sdraft, id: "novo", nome: S.sdraft.nome + " (cópia)", opcoes: S.sdraft.opcoes.map(o => ({ ...o })) }; toast("Cópia criada. Ajuste e publique."); render(); window.scrollTo(0, 0); return; }
  if (t.id === "svc-arq") { const s = SERVICES.find(x => x.id === S.sdraft.id); s.disp = "arquivado"; S.cart = S.cart.filter(k => it(k).sid !== s.id); S.sdraft = null; toast(s.nome + " arquivado."); render(); return; }
  if (t.id === "abrir-cats") { S.cats = true; render(); window.scrollTo(0, 0); return; }
  if (d.catsfechar) { S.cats = false; render(); return; }
  if (t.id === "cat-add") {
    const n = document.getElementById("cat-nova").value.trim();
    if (!n) { toast("Escreva o nome da categoria."); return; }
    if (CATS.some(c => c.toLowerCase() === n.toLowerCase())) { toast("Essa categoria já existe."); return; }
    CATS.push(n); toast("Categoria " + n + " criada."); render(); return;
  }
  if (d.rmcat) {
    const c = CATS[+d.rmcat];
    if (SERVICES.some(s => s.cat === c && s.disp !== "arquivado")) { toast("Mova ou arquive os serviços de " + c + " antes de excluir."); return; }
    if (CATS.length === 1) { toast("Precisa ter pelo menos uma categoria."); return; }
    CATS.splice(+d.rmcat, 1); PROS.forEach(p => p.cats = p.cats.filter(x => x !== c)); toast("Categoria " + c + " excluída."); render(); return;
  }
  /* equipe */
  if (d.proedit) {
    const p = d.proedit === "novo" ? { id: "novo", nome: "", foto: "", cats: [], faz: "", ini: "09:00", fim: "18:00", cor: CORES[PROS.length % CORES.length] } : pro(d.proedit);
    S.draft = { ...p, cats: [...p.cats] }; S.confirmDel = false; render(); window.scrollTo(0, 0); return;
  }
  if (d.profechar) { S.draft = null; render(); window.scrollTo(0, 0); return; }
  if (d.dcat) { const c = S.draft.cats; S.draft.cats = c.includes(d.dcat) ? c.filter(x => x !== d.dcat) : [...c, d.dcat]; render(); return; }
  if (d.cor) { S.draft.cor = d.cor; render(); return; }
  if (t.id === "pro-foto") { document.getElementById("foto-input").click(); return; }
  if (t.id === "pro-salvar") {
    const dr = S.draft;
    if (!dr.nome.trim()) { toast("Coloque o nome da profissional."); return; }
    if (!dr.cats.length) { toast("Escolha pelo menos uma especialidade."); return; }
    if (toMin(dr.fim) - toMin(dr.ini) < 60) { toast("O expediente precisa ter pelo menos 1 hora."); return; }
    const dados = { nome: dr.nome.trim(), foto: dr.foto, cats: dr.cats, faz: dr.faz.trim() || dr.cats.join(", "), ini: dr.ini, fim: dr.fim, cor: dr.cor };
    if (dr.id === "novo") { PROS.push({ id: "p" + (++seq), ...dados }); toast(dados.nome + " entrou na equipe."); }
    else { Object.assign(PROS.find(p => p.id === dr.id), dados); toast("Dados de " + dados.nome + " salvos."); }
    S.draft = null; render(); window.scrollTo(0, 0); return;
  }
  if (d.delask) { S.confirmDel = true; render(); return; }
  if (d.delcancel) { S.confirmDel = false; render(); return; }
  if (t.id === "pro-excluir") { const i = PROS.findIndex(p => p.id === S.draft.id), n = PROS[i].nome; PROS.splice(i, 1); S.draft = null; S.confirmDel = false; toast(n + " saiu da equipe."); render(); window.scrollTo(0, 0); return; }
});
document.addEventListener("change", e => {
  if (e.target.id === "fin-dia") { S.finDay = e.target.value; render(); return; }
  if (e.target.id === "e-cat" || e.target.id === "e-disp") { lerSvc(); render(); return; }
  if (e.target.dataset.catidx) {
    const i = +e.target.dataset.catidx, velho = CATS[i], novo = e.target.value.trim();
    if (!novo || novo === velho) { e.target.value = velho; return; }
    if (CATS.includes(novo)) { toast("Essa categoria já existe."); e.target.value = velho; return; }
    CATS[i] = novo; SERVICES.forEach(s => { if (s.cat === velho) s.cat = novo; }); PROS.forEach(p => p.cats = p.cats.map(x => x === velho ? novo : x));
    if (S.cat === velho) S.cat = novo;
    toast("Categoria renomeada para " + novo + "."); render(); return;
  }
  if (e.target.id === "foto-input" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"), s = 320, k = Math.min(img.width, img.height); c.width = c.height = s;
        c.getContext("2d").drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, s, s);
        const url = c.toDataURL("image/jpeg", 0.85);
        if (S.as === "salao" && S.sdraft) S.sdraft.foto = url; else if (S.as === "salao" && S.draft) S.draft.foto = url; else S.perfil.foto = url;
        toast("Foto adicionada."); render();
      };
      img.src = r.result;
    };
    r.readAsDataURL(e.target.files[0]); e.target.value = "";
  }
});
document.addEventListener("input", e => {
  const k = { "p-nome": "nome", "p-fone": "fone", "p-end": "end" }[e.target.id];
  if (k) S.perfil[k] = e.target.value;
  if (e.target.id === "f-nome") S.fNome = e.target.value;
  if (e.target.id === "f-fone") S.fFone = e.target.value;
  if (e.target.id === "f-obs") S.obs = e.target.value;
  const dk = { "d-nome": "nome", "d-faz": "faz", "d-ini": "ini", "d-fim": "fim" }[e.target.id];
  if (dk && S.draft) S.draft[dk] = e.target.value;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (S.zoom) S.zoom = null; else if (S.sheet) S.sheet = null; else return; render(); } });
render();
</script>
